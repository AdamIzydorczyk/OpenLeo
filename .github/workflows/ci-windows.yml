# The Windows gate: run ONCE at the end of implementation, not per push.
# Owner ruling 2026-11-19 (HANDOFF.md section 2 rule 8). Implementation is
# Linux-first; the port is ONE shared codebase (ported/), so Linux
# correctness is the risk and the Windows target is a build-target question.
# Measured reason to defer it: of the 307 s local suite, the pure-Windows
# leg verify-win alone is 164.8 s = 53.7% - 23 cold wine starts plus five
# replays of the same menu chain.
#
# What is here is exactly what ci.yml used to run for Windows, unchanged:
#   cross          - the sha-pinned vendor SDL2 mingw provisioning, the mingw
#                    cross build, the Windows-side Makefile legs, cmake cross
#                    parity, and the .exe artifacts (the old ci.yml list);
#   windows-smoke  - the native MSYS2/MINGW64 build + run, moved verbatim.
#
# Run it: Actions -> open-leo-ci-windows -> Run workflow (workflow_dispatch),
# or push a tag matching windows-gate-*. Pair it with the LOCAL
# `make -k verify-windows`, which runs the same legs WITH the game data - the
# fixtures are gitignored and never reach a runner, so the byte-exact frame
# proofs under wine only ever run at home.
name: ci-windows

on:
  workflow_dispatch:
  push:
    tags: ['windows-gate-*']

permissions:
  contents: read
  packages: read
  # The line above is needed to pull the CI toolchain image below (a
  # private GHCR package reads as "not found" without it - see the note
  # in ci.yml, same measurement).

jobs:
  cross:
    runs-on: ubuntu-latest
    # the same pre-baked image ci.yml uses - it carries the mingw
    # cross toolchain and windres, which is exactly what this job needs
    container:
      image: ghcr.io/adamizydorczyk/open-leo-ci:ci
      # same private-package auth as ci.yml (the image carries the mingw
      # cross toolchain and windres, which is what this job needs)
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Provision SDL2 for the Windows target
        # moved verbatim from ci.yml: it is what the cross build needs.
        # Ubuntu apt has no mingw SDL2; the Makefile's SDL_WIN points at the
        # vendored layout, so CI unpacks the SAME official SDL2 mingw devel
        # tarball (zlib-licensed OSS, not game data) into vendor/. Identical
        # version to the local gitignored copy keeps the two builds equal.
        # Pin: sha256 of https://www.libsdl.org/release/SDL2-devel-2.32.10-mingw.tar.gz
        # (computed 2026-11-15 from that exact URL; bump together with the
        # version - deliberately breaking this line must fail the job).
        run: |
          mkdir -p vendor
          curl -fsSLo /tmp/sdl.tar.gz \
            https://www.libsdl.org/release/SDL2-devel-2.32.10-mingw.tar.gz
          echo "83a5d74012311edc3c0d40ea6faecbe57ad692aa033fa5dc273cc937e3938ff2  /tmp/sdl.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/sdl.tar.gz -C vendor

      - name: Cross-build the full .exe set (the build-parity gate)
        run: make -j"$(nproc)" win

      - name: Windows-side legs (no fixtures on a runner, so the data-backed
              halves print their named SKIPs; the .exe cross-builds that are
              their prerequisites still run - that is the proof here)
        # Serial ON PURPOSE: verify-win and verify-mod both drive wine, and
        # a WINEPREFIX is not safe to share between concurrent wines. This
        # job runs once per end-of-implementation pass, so it does not pay
        # for the ~3x that -j gives the Linux legs.
        run: |
          make -k verify-windows
          make verify-cmake

      - name: Upload the Windows artifacts (the exact list ci.yml used)
        uses: actions/upload-artifact@v4
        with:
          name: open-leo-windows-${{ github.sha }}
          path: |
            ll_cutscene.exe
            ll_level.exe
            ll_save.exe
            llrs_selftest.exe
            pcx_selftest.exe
            seq_selftest.exe
            seq_patchdump.exe
            pcm_selftest.exe
            mod_selftest.exe
          if-no-files-found: error

  # FIX-12 (B-01), moved verbatim out of ci.yml on 2026-11-19. The .exe targets have only ever been CROSS-built and
  # run under wine. This job proves the native Windows toolchain path:
  # MSYS2 MINGW64 builds and runs the SDL-free headless selftests (the
  # T-01 dummy backend - no display needed), runs them against the
  # repo-committed fixtures, and smoke-starts the REAL ll_cutscene.exe
  # linked against MSYS2's SDL2. Sanitizer flags are switched off here
  # (SAN=, MSYS2 gcc has no asan runtime) - sanitizer coverage lives in
  # the asan job; this job proves the native Windows toolchain path.
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        # FIX-14 (B): cache:true keeps setup-msys2's pacman package cache
        # across runs (keyed on its lockfile, refreshed when the install
        # list below changes) - the measured install leg (~28s) is mostly
        # gone on a warm cache. This job keeps running natively on the
        # Windows runner ON PURPOSE (that is its whole point), so the
        # Linux jobs' container image deliberately does not apply here.
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            make
            pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-SDL2

      - name: Build the headless selftests natively
        shell: msys2 {0}
        # SAN=: MSYS2's mingw-w64 gcc ships no libasan/libubsan (measured
        # on the first run of this job: cannot find -lasan), so the
        # always-on sanitizer flags of the tool rules are switched off
        # here (Makefile SAN ?=, PR-27b). Sanitizer coverage stays on
        # the asan job; this job's value is native build + real runs.
        run: make -j SAN= platform_selftest llrs_selftest pcx_selftest seq_selftest seq_patchdump pcm_selftest mod_selftest

      - name: Run them (committed fixtures only; no game-data staging)
        shell: msys2 {0}
        run: |
          ./platform_selftest
          ./llrs_selftest data/ANIMACJE
          ./llrs_selftest data/ETAPY
          ./llrs_selftest data/SOUND
          make verify-arch
        # platform_selftest defaults to data/INTRO_P.IS (in git). The
        # make-side verify-* legs would SKIP here (no $(DATA) staging) -
        # running the built binaries directly gives the REAL assertions.

      - name: Build the real .exe against native SDL2
        shell: msys2 {0}
        # XC/WINDRES/SDL_WIN point the existing cross rules at the native
        # MSYS2 toolchain (-DPLATFORM_WIN=1, SDL_main, static runtime):
        # the same recipe the Linux cross-build uses, natively.
        run: make XC=gcc WINDRES=windres SDL_WIN=/mingw64 ll_cutscene.exe

      - name: Smoke-run the .exe headless (--help, expect exit 0)
        shell: msys2 {0}
        # FIX-13 landed: --help is a real CLI answer now instead of being
        # treated as FILE.IS, so (as FIX-12 anticipated) the smoke asks
        # for a DEFINED answer: usage text + exit 0. Proves: process
        # starts, SDL2 links and loads, SDL_main runs, argument parsing
        # and the exit path complete cleanly.
        run: |
          mkdir -p /tmp/leo-smoke
          cp ll_cutscene.exe /tmp/leo-smoke/
          # The .exe links MSYS2's libSDL2 DLL; copy it plus any runtime
          # DLLs that build depends on (winpthread/gcc are system DLLs in
          # the official libsdl.org build but NOT guaranteed in MSYS2's).
          for d in /mingw64/bin/libSDL2*.dll /mingw64/bin/libwinpthread*.dll \
                   /mingw64/bin/libgcc_s_seh*.dll /mingw64/bin/libstdc++*.dll; do
            if [ -f "$d" ]; then cp "$d" /tmp/leo-smoke/; fi
          done
          cd /tmp/leo-smoke
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          set +e
          out=$(./ll_cutscene.exe --help 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "windows smoke FAILED: --help exit $rc, expected 0"; exit 1; fi
          printf '%s\n' "$out" | grep -q 'usage:' || { echo "windows smoke FAILED: no usage text"; exit 1; }
          echo "windows smoke: native .exe starts, links SDL2, runs SDL_main, CLI answers (ok)"
