# CI for the Lew Leon recompile. The Makefile suite is CI-safe by design:
# every fixture-backed leg (game data, save originals, MS-DOS boot image,
# QEMU golden rig) is wrapped in a parse-time probe and prints a named
# SKIP with the exact staging command when its fixture is absent, so a
# bare runner executes the hermetic half - both target builds, the codec
# selftests, the fuzz corpus, the T-01 architecture pin and the cmake
# build-parity check - and nothing else executes stray commands.
#
# The data-backed legs (byte-exact frame proofs, menu/golden comparisons)
# run locally: LL.iso and the LEO_HDD/save originals are user-supplied,
# copyrighted and gitignored on purpose, so they never reach the runner.
# Local full run: stage fixtures per NEXT_STEPS.md, then `make -k verify-all`.
#
# FIX-12 (deep dive B-01) additions, this file only:
# - the SDL2 mingw tarball download is sha256-pinned;
# - both built target sets are uploaded as artifacts;
# - windows-smoke: a NATIVE MSYS2/MINGW64 build + run (the .exe has so
#   far only ever been cross-compiled and exercised under wine);
# - asan: ASan/UBSan build of main + tools, run against the repo-committed
#   fixtures (data/INTRO_P.IS, the ANIMACJE/ETAPY/SOUND containers).
#
# FIX-14 (CI speed, measured) additions, this file only:
# - the measured critical path of a run was the linux job (5m04s) and 81%
#   of it was ONE step: "Install toolchain" at 4m07s, downloading 149 MB
#   of archives (the mingw-w64 cross toolchain, cmake, the libsdl2-dev
#   closure). That step now lives in a pre-baked image: the linux and
#   asan jobs run in ghcr.io/adamizydorczyk/open-leo-ci:ci, built by
#   ci-image.yml from .github/ci/Dockerfile (same apt package list, no
#   game data - every fixture probe still prints its named SKIP).
#   BOOTSTRAP: publish the image once (Run workflow on ci-image.yml)
#   before landing this file, or ci.yml's container pull fails.
#   If the repo/owner is ever renamed, update the image path in BOTH
#   files together (GHCR names are lower-case).
# - windows-smoke: msys2's own package cache (setup-msys2's cache: true),
#   keyed by its lockfile; pacman fetches drop from ~28s to near zero.
# No Makefile, test-leg or artifact change: identical commands, identical
# coverage, only the toolchain acquisition moved.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read
  # The line above is REQUIRED for the container: pulls below. Measured on
  # 2026-11-19: with contents:read only, GHCR answers the pull of a
  # private package as "ghcr.io/adamizydorczyk/open-leo-ci:ci: not found"
  # (a 404, not a 403 - GHCR hides what the token cannot see), which
  # reads like a missing image and sent me debugging the image builder
  # twice. The image was published and pullable the whole time.

jobs:
  linux:
    runs-on: ubuntu-latest
    # FIX-14: toolchain pre-baked (see the header note). The image is the
    # OLD apt package list verbatim: native gcc + system SDL2 (the vendored
    # vendor/SDL2-2.32.10 and vendor/llvm-mingw are gitignored, so the
    # Makefile's system fallbacks apply) and the mingw-w64 gcc + windres
    # for the cross target (Makefile XC fallback path).
    container:
      # lower-case literal: it must match env.IMAGE in ci-image.yml (see
      # the note there - GHCR names are lower-case and a job-level
      # container: cannot be computed by an expression/step).
      image: ghcr.io/adamizydorczyk/open-leo-ci:ci
      # Explicit registry auth. The package is private (GHCR's default for
      # a new one); an unauthenticated/under-scoped pull of a private
      # package reports "not found", not "unauthorized" - that is the
      # misleading 404 this workflow hit on 2026-11-19. GITHUB_TOKEN of
      # THIS repository reads its own packages (needs packages: read).
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # (the old "Install toolchain" step is what the image replaced -
      # 4m07s of apt + 149 MB of archives; the pull hits the layer cache)

      - name: Python tools compile check (the suite's oracles are Python)
        run: python3 -m compileall -q tools

      - name: Build the native target
        # Ruling 2026-11-19 (HANDOFF s2 r8): the per-push path is Linux-only.
        # The `make win` cross build and the vendor/SDL2 mingw provisioning
        # that it needed moved to ci-windows.yml; the Makefile's verify-cmake
        # windows half now prints its documented SKIP here (no $(SDL_WIN)).
        run: make -j"$(nproc)"

      - name: Suite (Linux legs; data-backed legs print clean SKIPs)
        # -j is safe and worth ~3x: measured 2026-11-19, the legs' scratch
        # paths are disjoint (the only shared file is the read-only py-refs
        # oracle frame), and a 4-core parallel run produced the SAME verdict
        # set as the serial run. Deliberately not parallel anywhere wine
        # runs: verify-windows keeps one WINEPREFIX and stays serial.
        run: make -k -j"$(nproc)" verify-all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-leo-${{ github.sha }}
          path: |
            ll_cutscene
            ll_level
            ll_save
            llrs_selftest
            pcx_selftest
            seq_selftest
            seq_patchdump
            pcm_selftest
            mod_selftest
            platform_selftest
            fuzz
          if-no-files-found: error

  # The Windows gate (this windows-smoke job, the cross build and the .exe
  # artifacts) left the per-push path on 2026-11-19 by the owner's ruling in
  # HANDOFF.md section 2 rule 8: implementation is Linux-first and the Windows
  # target is verified ONCE at the end. It now lives in
  # .github/workflows/ci-windows.yml - run it from Actions with "Run workflow",
  # or push a windows-gate-* tag. The job itself is unchanged.
  # FIX-12 (B-01): ASan/UBSan build of the main binary + tools, run
  # against the repo-committed fixtures (NOT the gitignored $(DATA)
  # staging - the data-backed legs SKIP here too; what runs here is
  # real: the full engine decode+present path through the dummy
  # platform (platform_selftest, committed data/INTRO_P.IS) and the
  # llrs codec over the three committed containers). SDL dummy drivers
  # per the documented leak-clean config (plan ruling C7).
  asan:
    runs-on: ubuntu-latest
    # FIX-14: the same pre-baked image (its package list is a superset of
    # this job's old apt list; the asan/ubsan runtimes ship with gcc, as
    # the previous runs proved).
    container:
      image: ghcr.io/adamizydorczyk/open-leo-ci:ci
      # same private-package auth as the linux job (see the note there)
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan+UBSan (flags as the fuzz leg composes them)
        run: |
          A="-O1 -g -std=gnu11 -Wall -Wextra -DPLATFORM_LINUX=1 \
             -fsanitize=address,undefined -fno-omit-frame-pointer"
          make -j"$(nproc)" CFLAGS="$A $(pkg-config --cflags sdl2)" \
            ll_cutscene ll_level ll_save platform_selftest \
            llrs_selftest pcx_selftest seq_selftest seq_patchdump \
            pcm_selftest mod_selftest

      - name: Run the committed-fixture paths under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ./platform_selftest
          ./llrs_selftest data/ANIMACJE
          ./llrs_selftest data/ETAPY
          ./llrs_selftest data/SOUND
          timeout 30 ./ll_level --mov-selftest   # FIX-13/X-11: termination
          ./ll_cutscene data/LOGO.IS --ppm 3 /tmp/asan_frame.ppm \
            > /tmp/asan_main.log 2>&1
          tail -1 /tmp/asan_main.log
          make verify-arch
        # NOTE: the selftest rules hardcode -fsanitize=address,undefined
        # (always-on since PR-11), so the "sanitizer" part above is the
        # strict option set + real committed bytes; the CFLAGS override
        # sanitizes the MAIN binary, exercised by the --ppm decode path
        # (measured locally: rc=0, leak-clean).
