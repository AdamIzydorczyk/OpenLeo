# ALSA null sink for QEMU sb16 when only screen timing matters (diagnostics).
# Same shape as lltap.conf but the file plugin writes to /dev/null: the
# guest still sees a live DMA path (the game's audio-paced code runs), but
# no capture data is written.  Use with
# ALSA_CONFIG_PATH=build/llnull.conf:/usr/share/alsa/alsa.conf plus
# -audiodev alsa,id=a,out.dev=tap.
defaults.pcm.file_truncate false
defaults.pcm.file_format raw

pcm.tap {
    type file
    file "/dev/null"
    format "raw"
    slave { pcm "null" }
}
