# ALSA tap for QEMU sb16 capture (diagnostics only).  Used via
# ALSA_CONFIG_PATH=build/lltap.conf:/usr/share/alsa/alsa.conf plus
# -audiodev alsa,id=a,out.dev=tap.  Deliberately does NOT redefine
# pcm.!default: defining it before alsa.conf makes alsa.conf fail to
# parse.  file_truncate=false so a reopen (rate/format change) appends
# instead of destroying the earlier capture.
defaults.pcm.file_truncate false
defaults.pcm.file_format raw

pcm.tap {
    type file
    file "/home/aizy/Projects/LL_RECOMPILE/build/qemu_audio.raw"
    format "raw"
    slave { pcm "null" }
}
